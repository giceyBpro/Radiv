<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Test API - Dosimétrie RIV</title>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; margin: 0; background: #eef1f3; color: #111; }
    main { max-width: 980px; margin: 24px auto; background: #fff; padding: 24px; border-radius: 10px; box-shadow: 0 8px 28px rgba(0,0,0,.12); }
    h1 { margin-top: 0; }
    .row { margin-bottom: 12px; }
    label { font-weight: 700; display: block; margin-bottom: 6px; }
    select, textarea, input, button { width: 100%; box-sizing: border-box; padding: 9px 10px; font-size: 14px; }
    textarea { min-height: 180px; font-family: Consolas, Monaco, monospace; }
    button { width: auto; cursor: pointer; border: 2px solid #1f1f1f; background: #fff; font-weight: 700; }
    pre { background: #f4f7f8; border: 1px solid #d5dde1; border-radius: 6px; padding: 12px; overflow: auto; }
    .small { color: #555; font-size: 13px; }
    .line { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .links { margin-top: 18px; display: flex; gap: 14px; flex-wrap: wrap; }
    a { color: #1637b8; }
    @media (max-width: 720px) { .line { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <h1>Page de test API</h1>
    <p class="small">Cette page permet de préparer une requête API simple et de lire la réponse.</p>

    <div class="line">
      <div class="row">
        <label for="apiBase">Base API</label>
        <input id="apiBase" type="text" value="api" />
      </div>
      <div class="row">
        <label for="endpoint">Endpoint</label>
        <select id="endpoint">
          <option value="config">GET /config</option>
          <option value="calculate" selected>POST /calculate</option>
        </select>
      </div>
    </div>

    <div class="row">
      <label for="payload">Payload JSON (uniquement pour POST /calculate)</label>
      <textarea id="payload">{
  "calculation_mode": "sfmn",
  "isotope_code": "iode131_25_fixation",
  "dose_rate": 9.9,
  "patient_size_cm": 150,
  "user_period_days": null,
  "user_hours_1": null,
  "user_distance_1": null,
  "user_hours_2": null,
  "user_limit": null,
  "benign_activity_mbq": null,
  "benign_fixation_pct": null,
  "cure_count": 1
}</textarea>
    </div>

    <div class="row">
      <button id="sendBtn" type="button">Envoyer la requête</button>
    </div>

    <div class="row">
      <label>Réponse reçue</label>
      <pre id="recvBox">-</pre>
    </div>

    <div class="links">
      <a href="/doc">← Retour page info API</a>
      <a href="/">← Retour page principale</a>
    </div>
  </main>

  <script src="config.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);

    function normalizeBase(base) {
      return (base || 'api').trim().replace(/\/+$/, '') || 'api';
    }

    $('apiBase').value = normalizeBase(window.RADIOPROTECTION_API_URL || $('apiBase').value);

    // Si le mode SFMN est désactivé côté serveur, l'exemple de payload par défaut ne doit
    // pas suggérer une valeur qui échouera systématiquement.
    (async () => {
      try {
        const resp = await fetch(`${$('apiBase').value}/config`);
        const config = await resp.json();
        const modes = config.calculation_modes || ['local', 'sfmn'];
        if (!modes.includes('sfmn')) {
          $('payload').value = $('payload').value.replace('"calculation_mode": "sfmn"', '"calculation_mode": "local"');
        }
      } catch (_) {
        // Config indisponible au chargement: l'exemple par défaut reste tel quel.
      }
    })();

    async function send() {
      const apiBase = normalizeBase($('apiBase').value);
      const endpoint = $('endpoint').value;
      const url = `${apiBase}/${endpoint}`;

      let method = 'GET';
      let body = null;
      const headers = {};

      if (endpoint === 'calculate') {
        method = 'POST';
        headers['Content-Type'] = 'application/json';
        try {
          body = JSON.parse($('payload').value);
        } catch (e) {
          $('recvBox').textContent = `Payload JSON invalide: ${e.message}`;
          return;
        }
      }

      $('recvBox').textContent = 'Requête en cours...';

      try {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 15000);
        let resp;
        try {
          resp = await fetch(url, {
            method,
            headers,
            body: body ? JSON.stringify(body) : undefined,
            signal: controller.signal
          });
        } finally {
          clearTimeout(timer);
        }

        const text = await resp.text();
        let parsed = text;
        try { parsed = JSON.parse(text); } catch (_) {}

        $('recvBox').textContent = JSON.stringify({
          status: resp.status,
          ok: resp.ok,
          data: parsed
        }, null, 2);
      } catch (error) {
        const isTimeout = error && error.name === 'AbortError';
        $('recvBox').textContent = JSON.stringify({
          error: isTimeout ? 'TIMEOUT' : 'NETWORK_ERROR',
          message: isTimeout
            ? 'Aucune réponse API après 15s.'
            : error.message
        }, null, 2);
      }
    }

    $('sendBtn').addEventListener('click', send);
  </script>
</body>
</html>
