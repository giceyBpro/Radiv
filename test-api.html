<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vérification du service - Dosimétrie RIV</title>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; margin: 0; background: #eef1f3; color: #111; }
    main { max-width: 860px; margin: 24px auto; background: #fff; padding: 24px; border-radius: 10px; box-shadow: 0 8px 28px rgba(0,0,0,.12); }
    h1 { margin-top: 0; }
    .row { margin-bottom: 14px; }
    label { font-weight: 700; display: block; margin-bottom: 6px; }
    input, button { width: 100%; box-sizing: border-box; padding: 10px; font-size: 14px; }
    .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    button { cursor: pointer; border: 2px solid #1f1f1f; background: #fff; font-weight: 700; }
    .result { border: 1px solid #d5dde1; border-radius: 6px; padding: 12px; background: #f4f7f8; min-height: 60px; }
    .ok { color: #0b7a33; font-weight: 700; }
    .ko { color: #b00020; font-weight: 700; }
    .links { margin-top: 18px; display: flex; gap: 14px; flex-wrap: wrap; }
    a { color: #1637b8; }
    @media (max-width: 720px) { .buttons { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <h1>Vérifier rapidement le bon fonctionnement du service</h1>
    <p>
      Cette page sert uniquement à vérifier que le service répond correctement pour un utilisateur du site.
    </p>

    <div class="row">
      <label for="apiBase">Adresse du service</label>
      <input id="apiBase" type="text" value="api" />
    </div>

    <div class="row buttons">
      <button id="checkConfigBtn" type="button">Vérifier la disponibilité du service</button>
      <button id="checkCalcBtn" type="button">Vérifier un calcul standard</button>
    </div>

    <div class="row">
      <div id="resultBox" class="result">Cliquez sur un bouton pour lancer une vérification.</div>
    </div>

    <div class="links">
      <a href="api-fonctionnement.html">← Retour à la page d’information</a>
      <a href="index.html">← Retour page principale</a>
    </div>
  </main>

  <script src="config.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);

    function normalizeBase(base) {
      return (base || 'api').trim().replace(/\/+$/, '') || 'api';
    }

    $('apiBase').value = normalizeBase(window.RADIOPROTECTION_API_URL || $('apiBase').value);

    function setResult(message, isOk) {
      $('resultBox').innerHTML = `<span class="${isOk ? 'ok' : 'ko'}">${isOk ? 'OK' : 'Échec'}</span><br>${message}`;
    }

    async function fetchWithTimeout(url, options = {}, timeoutMs = 15000) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);
      try {
        return await fetch(url, { ...options, signal: controller.signal });
      } finally {
        clearTimeout(timer);
      }
    }

    async function checkConfig() {
      const apiBase = normalizeBase($('apiBase').value);
      setResult('Vérification en cours…', true);
      try {
        const resp = await fetchWithTimeout(`${apiBase}/config`);
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        setResult('Le service répond correctement.', true);
      } catch (error) {
        setResult(`Le service ne répond pas correctement (${error.message}).`, false);
      }
    }

    async function checkCalculation() {
      const apiBase = normalizeBase($('apiBase').value);
      setResult('Calcul test en cours…', true);
      const payload = {
        calculation_mode: 'local',
        isotope_code: 'iode131_25_fixation',
        dose_rate: 10,
        patient_size_cm: 150,
        user_period_days: null,
        user_hours_1: null,
        user_distance_1: null,
        user_hours_2: null,
        user_limit: null,
        benign_activity_mbq: null,
        benign_fixation_pct: null,
        cure_count: 1
      };
      try {
        const resp = await fetchWithTimeout(`${apiBase}/calculate`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const data = await resp.json();
        if (!data || !Array.isArray(data.errors)) throw new Error('réponse inattendue');
        setResult('Le calcul test a répondu correctement.', true);
      } catch (error) {
        setResult(`Le calcul test n’a pas abouti (${error.message}).`, false);
      }
    }

    $('checkConfigBtn').addEventListener('click', checkConfig);
    $('checkCalcBtn').addEventListener('click', checkCalculation);
  </script>
</body>
</html>
