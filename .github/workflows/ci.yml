name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # PHP (public/api et backend/): syntaxe de chaque fichier, puis non-régression du calcul
      # (cas figés, modes d'arrondi round et floor). PHP est préinstallé sur ubuntu-latest.
      - name: Lint PHP
        run: find public backend install.php update.php -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Non-régression du calcul
        run: node tests/test-calcul.js
      - name: Adresse IP derrière un proxy, réglages par défaut et cache
        run: |
          php tests/test-client-ip.php
          php tests/test-config-store.php
      - name: Contrôles reCAPTCHA côté serveur
        run: node tests/test-recaptcha.js
      - name: Cohérence de la mise en forme de runtime.env
        run: node tests/check-runtime-layout.js
      - name: Aucun fichier PHP du backend ne s'exécute seul
        run: node tests/test-backend-guard.js
