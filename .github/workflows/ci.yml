name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Port PHP (api/): syntaxe de chaque fichier, puis non-régression du calcul
      # (cas figés, modes d'arrondi round et floor). PHP est préinstallé sur ubuntu-latest.
      - name: Lint PHP
        run: find api install.php update.php -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Non-régression du calcul
        run: node api/tests/test-calcul.js
      - name: Cohérence de la mise en forme de .runtime.env
        run: node api/tests/check-runtime-layout.js
